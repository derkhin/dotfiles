# Change prefix to Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Enable mouse support (click to focus panes, resize panes, select windows)
set -g mouse on

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Continuum settings
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ── Minimal LazyVim-inspired status bar ──────────────────────────
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#6c7086"
set -g status-left-length 40
set -g status-right-length 40

# theme 
set -g @plugin 'egel/tmux-gruvbox'
# set desired theme options...
set -g @tmux-gruvbox 'dark' # or 'dark256', 'light', 'light256'
set -g @tmux-gruvbox-statusbar-alpha 'true'

# Left: session name in accent color
set -g status-left "#[fg=#89b4fa,bg=#1e1e2e,bold]  #S #[fg=#313244]│ "

# Right: minimal date/time
set -g status-right "#[fg=#6c7086] %H:%M #[fg=#313244]│ #[fg=#89b4fa]%d-%b "

# Window tabs: clean, minimal
set -g window-status-format "#[fg=#6c7086,bg=#1e1e2e]  #I #W "
set -g window-status-current-format "#[fg=#cdd6f4,bg=#313244,bold]  #I #W "
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Message styling
set -g message-style "fg=#cdd6f4,bg=#313244"
set -g message-command-style "fg=#cdd6f4,bg=#313244"

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ─────────────────────────────────────────────────────────────────

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
